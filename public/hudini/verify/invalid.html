<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HUDini Invalid Verification Link</title>
    <style>
      :root {
        color-scheme: light;
        --bg-top: #eef4ff;
        --bg-bottom: #fbfcff;
        --ink: #172033;
        --muted: #61708a;
        --line: rgba(23, 32, 51, 0.08);
        --card: rgba(255, 255, 255, 0.82);
        --accent: #1f6fff;
        --danger: #d84f62;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(97, 174, 255, 0.28), transparent 28rem),
          radial-gradient(circle at bottom right, rgba(248, 113, 113, 0.16), transparent 24rem),
          linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
      }
      .card {
        width: min(100%, 640px);
        padding: 32px;
        border-radius: 28px;
        background: var(--card);
        border: 1px solid rgba(255, 255, 255, 0.85);
        box-shadow: 0 24px 60px rgba(17, 24, 39, 0.12);
        backdrop-filter: blur(18px);
      }
      .eyebrow {
        margin: 0 0 14px;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }
      .brand-mark {
        width: 52px;
        height: 52px;
        border-radius: 18px;
        display: block;
        background: linear-gradient(135deg, #ffffff, #dcebff);
        box-shadow: inset 0 0 0 1px rgba(31, 111, 255, 0.08);
        overflow: hidden;
      }
      .brand-mark img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 4vw, 2.8rem);
        line-height: 1.02;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.65;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 22px 0 18px;
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(216, 79, 98, 0.12);
        color: var(--danger);
        font-weight: 700;
      }
      .footer {
        margin-top: 22px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">HUDini Verification</p>
      <div class="brand">
        <div class="brand-mark"><img src="/hudini/logo.png" alt="HUDini logo" /></div>
        <strong>HUDini</strong>
      </div>
      <h1>Invalid verification link.</h1>
      <p>This verification request cannot be completed. The link may be malformed, incomplete, or already replaced by a newer one.</p>
      <div class="status">Link invalid</div>
      <p class="footer">Use the latest verification email generated by the HUDini signup flow.</p>
    </main>
  </body>
</html>
